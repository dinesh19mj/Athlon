spring.application.name=IDENTITYSERVICE
server.port=5052

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://13.205.211.168:5432/caremydear_db
spring.datasource.username=caremydear_user
spring.datasource.password=CareMyDear@2026#Secure

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.level.root=INFO
logging.level.com.athlon.auth=DEBUG

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
