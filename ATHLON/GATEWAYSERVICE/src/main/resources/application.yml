server:
  port: 5050

spring:
  application:
    name: gateway-service

  cloud:
    gateway:

      routes:

        - id: auth_route
          uri: http://localhost:5051
          predicates:
            - Path=/api/auth/**

        - id: identity_route
          uri: http://localhost:5052
          predicates:
            - Path=/api/identity/**

        - id: tournament_route
          uri: http://localhost:5053
          predicates:
            - Path=/api/tournament/**

        - id: tournament_ws_route
          uri: ws://localhost:5053
          predicates:
            - Path=/ws/**

      httpclient:
        wiretap: true

      httpserver:
        wiretap: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      globalcors:
        add-to-simple-url-handler-mapping: true

        corsConfigurations:
          '[/**]':

            allowedOrigins: "*"

            allowedHeaders: "*"

            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS

            maxAge: 3600

logging:
  level:

    reactor:
      netty: INFO

    org:
      springframework:
        cloud:
          gateway: TRACE