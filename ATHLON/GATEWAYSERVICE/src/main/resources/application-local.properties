spring.application.name=GATEWAYSERVICE
server.port=5050

# Service URLs (downstream microservices)
service.auth.url=http://localhost:5051
service.identity.url=http://localhost:5052
service.tournament.url=http://localhost:5053

# Logging
logging.level.root=INFO
logging.level.com.athlon.gateway=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# JWT (same secret as auth service so gateway can validate tokens)
athlon.jwt.secret=3b7d2eaf8c1d4f8e9a5c6b7d8e9f0a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
athlon.jwt.access-token-expiry=900000
athlon.jwt.refresh-token-expiry=604800000
