# Redirect HTTP (port 80) for athlon.co.in and www.athlon.co.in to HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name athlon.co.in www.athlon.co.in;

    return 301 https://athlon.co.in$request_uri;
}

# Redirect HTTPS www.athlon.co.in to https://athlon.co.in
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.athlon.co.in;

    ssl_certificate /etc/letsencrypt/live/athlon.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athlon.co.in/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://athlon.co.in$request_uri;
}

# Main HTTPS server block for athlon.co.in
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name athlon.co.in;

    ssl_certificate /etc/letsencrypt/live/athlon.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athlon.co.in/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static files -> served directly by Nginx with aggressive caching
    location /_next/static/ {
        alias /home/ubuntu/athlon-user/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files
    location /manifest.json {
        alias /home/ubuntu/athlon-user/public/manifest.json;
        add_header Cache-Control "public, max-age=3600";
    }

    location /icons/ {
        alias /home/ubuntu/athlon-user/public/icons/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /images/ {
        alias /home/ubuntu/athlon-user/public/images/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # API routes -> Backend Gateway (127.0.0.1:5050)
    location /api/ {
        proxy_pass http://127.0.0.1:5050;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Frontend routes -> Next.js (127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
